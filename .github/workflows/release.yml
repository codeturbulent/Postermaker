name: Build APK and Upload to Release

# Triggers the workflow on push events to the main or instbuild branches
on:
  push:
    branches:
      - main
      - instbuild
# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build APK and Upload to Release
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: false    
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false 
          remove_swap: true
          rm_cmd: "rmz"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Getting APK Name
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message || github.event.pull_request.title }}
        run: |
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/[^a-zA-Z0-9._-]/_/g')
          if [ -z "$CLEAN_MSG" ]; then
            CLEAN_MSG="build"
          fi
          # Limit length to prevent invalid git tag names
          CLEAN_MSG=$(echo "$CLEAN_MSG" | cut -c1-30)
          APK_NAME="${CLEAN_MSG}_$(TZ="Asia/Kolkata" date +"%Y-%m-%d_%H-%M-%S")"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release_artifacts/${{ env.APK_NAME }}.apk

      - name: Push to Release Tab
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APK_NAME }}
          name: "Release ${{ env.APK_NAME }}"
          body: |
            ## 🚀 Automated Release Build
            
            - **Release Tag**: `${{ env.APK_NAME }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Commit Message**: ${{ github.event.head_commit.message }}
            
            ### 📦 Download APK
            - **Direct APK**: `${{ env.APK_NAME }}.apk`
          files: release_artifacts/${{ env.APK_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
