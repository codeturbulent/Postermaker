name: Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Extract Version Info
        id: version_info
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -d '+' -f 2)
          echo "raw_version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          
          # If triggered by tag, use tag name; otherwise create v<version_name> tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION_NAME}-b${BUILD_NUMBER}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Package Artifacts
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release_artifacts/Postermaker-v${{ steps.version_info.outputs.version_name }}-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release_artifacts/Postermaker-v${{ steps.version_info.outputs.version_name }}-release.aab
          cd release_artifacts
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Postermaker ${{ steps.version_info.outputs.tag_name }} Release"
          body: |
            ## 🚀 Postermaker Automated Release (${{ steps.version_info.outputs.tag_name }})
            
            ### ✨ Highlights
            - **Production-Ready Flutter 3.24+ / Dart 3+ Architecture**
            - **High-Definition Poster Compositor** (`1080x1080` & `1080x1350` crisp PNG export via `RepaintBoundary`)
            - **Devanagari Typography Protection** (Dual-pass `StrokedText` with `StrutStyle` height safety for Hindi matras)
            - **Authentic Regional Templates**:
              - 🪔 *दीपावली महापर्व* (Festival Golden Saffron)
              - 🗳️ *विजयी भव: पंचायत चुनाव* (Panchayat Election Banner)
              - 🚩 *युवा नेता - क्रांति दिवस* (Samajwadi / Socialist Style)
              - 🇮🇳 *राष्ट्र प्रथम - विकास पर्व* (BJP Style Saffron & Blue)
              - 🎂 *जन्मदिन की अनंत बधाई* (Birthday Felicitation)
            - **Direct Sharing & Gallery Saving**: Native WhatsApp / Social share (`share_plus`) and direct storage (`gal`).
            
            ### 📦 Artifacts
            - **Release APK**: `Postermaker-v${{ steps.version_info.outputs.version_name }}-release.apk` (Installable on Android devices)
            - **App Bundle**: `Postermaker-v${{ steps.version_info.outputs.version_name }}-release.aab` (Ready for Google Play Store upload)
            
            ---
            *Built automatically via GitHub Actions CI/CD.*
          files: |
            release_artifacts/*.apk
            release_artifacts/*.aab
            release_artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
