name: Release CD (Android)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Production AAB / APK & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_swap: false
          rm_cmd: "rmz"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Android Keystore & Configure Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Production keystore and key.properties configured."
          else
            echo "No KEYSTORE_BASE64 secret found; build will use debug signing fallback."
          fi

      - name: Generate Production Environment Config (--dart-define-from-file)
        env:
          PROD_ENV_CONFIG: ${{ secrets.PROD_ENV_CONFIG }}
        run: |
          mkdir -p config
          if [ -n "$PROD_ENV_CONFIG" ]; then
            echo "$PROD_ENV_CONFIG" > config/prod_env.json
          elif [ ! -f config/prod_env.json ]; then
            cp config/env.example.json config/prod_env.json
          fi
          echo "Production environment configuration ready."

      - name: Resolve Release Artifact Name
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'release_build' }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n 1 | tr -d '\r')
          CLEAN_MSG=$(printf '%s' "$FIRST_LINE" | tr -c 'a-zA-Z0-9' '_' | tr -s '_' | sed 's/^_//;s/_$//' | cut -c1-25)
          CLEAN_MSG=$(printf '%s' "$CLEAN_MSG" | sed 's/_$//')
          if [ -z "$CLEAN_MSG" ]; then
            CLEAN_MSG="release"
          fi
          TIMESTAMP=$(TZ="Asia/Kolkata" date +"%Y-%m-%d_%H-%M-%S")
          RELEASE_NAME="${CLEAN_MSG}_v${{ github.run_number }}_${TIMESTAMP}"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          flutter pub get
          mkdir -p build/app/outputs/symbols

      - name: Build Universal Release APK
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=config/prod_env.json \
            --android-skip-build-dependency-validation

      - name: Prepare Release Artifact
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/${{ env.RELEASE_NAME }}.apk"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ env.RELEASE_NAME }}
          name: "Release ${{ env.RELEASE_NAME }}"
          body: |
            ## 🚀 Automated Production Release

            - **Release Tag**: `v-${{ env.RELEASE_NAME }}`
            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            ### 📦 Download Release APK
            - **Direct APK**: `${{ env.RELEASE_NAME }}.apk`
          files: release_artifacts/${{ env.RELEASE_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
