name: Build APK and Upload to Release

on:
  push:
    branches:
      - main
      - instbuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build APK and Upload to Release
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_swap: false # CRITICAL: Keep swap enabled so Gradle doesn't crash with OOM (Exit 137)
          rm_cmd: "rmz"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Folder (If Cloud-Only Repo)
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ directory found. Generating platform files..."
            flutter create --platforms=android .
          fi

      - name: Ensure UCropActivity & Permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "UCropActivity" "$MANIFEST"; then
            sed -i 's|</application>|        <activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>\n    </application>|g' "$MANIFEST"
          fi

      - name: Getting APK Name
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message || 'manual_build' }}
        run: |
          # Strip non-alphanumeric chars, collapse multiple underscores, and strip leading/trailing underscores
          CLEAN_MSG=$(echo "$COMMIT_MSG" \vert{} head -n 1 \vert{} sed 's/[^a-zA-Z0-9]/_/g' \vert{} sed 's/__*/_/g' \vert{} sed 's/^_//;s/_$//' | cut -c1-25)
          if [ -z "$CLEAN_MSG" ]; then
            CLEAN_MSG="build"
          fi
          APK_NAME="${CLEAN_MSG}_$(TZ="Asia/Kolkata" date +"%Y-%m-%d_%H-%M-%S")"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Build APK
        env:
          # 3g heap + 1g metaspace leaves enough RAM for Dart gen_snapshot on a 7GB runner
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          flutter pub get
          flutter build apk --release --no-shrink --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/${{ env.APK_NAME }}.apk"

      - name: Push to Release Tab
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ env.APK_NAME }}
          name: "Release ${{ env.APK_NAME }}"
          body: |
            ## 🚀 Automated Release Build
            
            - **Release Tag**: `v-${{ env.APK_NAME }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            
            ### 📦 Download APK
            - **Direct APK**: `${{ env.APK_NAME }}.apk`
          files: release_artifacts/${{ env.APK_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
