name: poster_maker
description: "A production-ready Flutter app for creating regional Indian festival and political posters."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Persistence
  shared_preferences: ^2.3.2

  # Media & Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Export & Sharing
  gal: ^2.3.0
  share_plus: ^10.1.0
  path_provider: ^2.1.4

  # Regional Typography & Icons
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
